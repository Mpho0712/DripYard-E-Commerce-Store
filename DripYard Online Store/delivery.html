<!-- HEADER: Taller Glass Effect -->
<header class="sticky-header" style="position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); height: 70px;">

  </nav>
  
  <!-- CENTER: Logo -->
  <div class="logo-wrapper" style="position: absolute; left: 50%; transform: translateX(-50%);">
    <img src="images/logo.png" alt="DripYard Logo" class="logo-image" style="height: 42px;" />
  </div>
  
</header>

<style>
  .main-nav a {
    color: #000000;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    transition: color 0.2s;
    white-space: nowrap;
  }
  .main-nav a:hover { color: #ff0000; }
  .main-nav a.active { color: #ff0000; font-weight: 600; }
</style>

  <main>
    <h1>Select Delivery Method</h1>

    <form class="delivery-form">
      <!-- Delivery Options -->
      <label>
        <input type="radio" name="delivery" value="PAXI_7_9" required />
        PAXI Standard Bag (7–9 working days) == R60
      </label>
      <label>
        <input type="radio" name="delivery" value="PAXI_3_5" required />
        PAXI Standard Bag (3–5 working days) == R110
      </label>
      <label>
        <input type="radio" name="delivery" value="Collect" required />
        Collect == Free
      </label>
      <small class="error" id="error-delivery"></small>

      <!-- User Info Fields -->
      <h2>Your Info</h2>

      <input type="text" id="full-name" placeholder="Full Name" required />
      <small class="error" id="error-full-name"></small>

      <input type="email" id="email" placeholder="Email Address" required />
      <small class="error" id="error-email"></small>

      <input type="text" id="phone" placeholder="Phone Number" required />
      <small class="error" id="error-phone"></small>

      <input type="text" id="address" placeholder="Street Address" required />
      <small class="error" id="error-address"></small>

      <input type="text" id="mall" placeholder="Mall Name" required />
      <small class="error" id="error-mall"></small>

      <input type="text" id="postal-code" placeholder="Postal Code" required />
      <small class="error" id="error-postal-code"></small>

      <select id="province" required>
        <option value="">Select Province</option>
        <option value="Eastern Cape">Eastern Cape</option>
        <option value="Free State">Free State</option>
        <option value="Gauteng">Gauteng</option>
        <option value="KwaZulu-Natal">KwaZulu-Natal</option>
        <option value="Limpopo">Limpopo</option>
        <option value="Mpumalanga">Mpumalanga</option>
        <option value="North West">North West</option>
        <option value="Northern Cape">Northern Cape</option>
        <option value="Western Cape">Western Cape</option>
      </select>
      <small class="error" id="error-province"></small>

      <!-- Continue Button -->
      <div class="checkout-button-wrapper">
        <button type="submit" id="continue-btn">Continue to Checkout</button>
      </div>
    </form>
  </main>
