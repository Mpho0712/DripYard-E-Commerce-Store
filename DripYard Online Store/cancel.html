  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ffffff, #092450);  color: #1e293b;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .cancel-container {
      background: white;
      border-radius: 24px;
      padding: 2.5rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cancel-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      animation: scaleIn 0.5s ease 0.2s both;
    }

    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .cancel-icon i {
      font-size: 2.5rem;
      color: white;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    .cancel-message {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .order-info-note {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #92400e;
      text-align: left;
    }

    .order-info-note i {
      margin-right: 0.5rem;
      color: #f59e0b;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.9rem 2rem;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg,  #0f172a, #3a5074);
      color: white;
      box-shadow: 0 8px 25px rgba(0, 26, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(0, 26, 255, 0.4);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
    }

    .btn-warning:hover {
      background: #d97706;
      transform: translateY(-2px);
    }

    @media screen and (max-width: 480px) {
      .cancel-container {
        padding: 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .cancel-icon {
        width: 60px;
        height: 60px;
      }

      .cancel-icon i {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="cancel-container">
    <div class="cancel-icon">
      <i class="fas fa-times-circle"></i>
    </div>
    <h1>Payment Cancelled</h1>
    <p class="cancel-message">
      Your payment was not completed. Your order has not been placed.
    </p>

    <div class="order-info-note">
      <i class="fas fa-info-circle"></i>
      <strong>Note:</strong> The order draft has been saved. Your cart items are still available and you can try again whenever you're ready.
    </div>

    <div class="action-buttons">
      <a href="checkout.html" class="btn btn-primary">
        <i class="fas fa-redo"></i> Try Again
      </a>
      <a href="cart.html" class="btn btn-warning">
        <i class="fas fa-shopping-cart"></i> Return to Cart
      </a>
      <a href="store.html" class="btn btn-secondary">
        <i class="fas fa-store"></i> Continue Shopping
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="cancel.js"></script>
</body>
</html>
