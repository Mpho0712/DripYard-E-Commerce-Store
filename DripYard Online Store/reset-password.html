<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - DripYard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .sticky-header {
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 0.8rem 1.5rem;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .logo-image { height: 42px; }

    .reset-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .reset-card {
      background: white;
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .reset-icon {
      width: 60px; height: 60px;
      background: #0f172a;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .reset-icon i { font-size: 1.5rem; color: white; }
    h2 { font-size: 1.4rem; font-weight: 700; color: #0f172a; margin-bottom: 0.5rem; }
    p { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: #0f172a; margin-bottom: 0.3rem; }
    .form-group input {
      width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0;
      border-radius: 10px; font-size: 0.9rem; outline: none;
    }
    .form-group input:focus { border-color: #0f172a; }
    .error { color: #ef4444; font-size: 0.75rem; margin-top: 0.2rem; display: block; }
    .btn {
      width: 100%; padding: 0.85rem; background: #0f172a; color: white;
      border: none; border-radius: 30px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; margin-top: 0.5rem; transition: all 0.2s;
    }
    .btn:hover { background: #1e293b; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { font-size: 0.85rem; margin-top: 1rem; display: none; }
    .message.success { color: #10b981; }
    .message.error { color: #ef4444; }
    .footer { text-align: center; padding: 1.5rem; font-size: 0.7rem; color: #94a3b8; }
  </style>
</head>
<body>

  <header class="sticky-header">
    <img src="images/logo.png" alt="DripYard" class="logo-image" />
  </header>

  <div class="reset-container">
    <div class="reset-card">
      <div class="reset-icon">
        <i class="fas fa-lock"></i>
      </div>
      <h2>Create New Password</h2>
      <p>Enter your new password below.</p>

      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" placeholder="Min. 6 characters" minlength="6" />
        <span class="error" id="password-error"></span>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Re-enter password" minlength="6" />
        <span class="error" id="confirm-error"></span>
      </div>

      <button class="btn" id="reset-btn" onclick="resetPassword()">Reset Password</button>
      <p class="message" id="message"></p>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2025 DripYard. All rights reserved.</p>
  </footer>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
  const client = supabase.createClient(
    'https://kidfloycujnakuovfeqg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZGZsb3ljdWpuYWt1b3ZmZXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NzMyMjEsImV4cCI6MjA3NDE0OTIyMX0.c1qjfTo1zasa2qSLIzjXNXUjp4U9S7DyP8VTEQV9ehs'
  );

  // Supabase automatically handles the reset token from the URL
  // The token is in the URL hash fragment (#access_token=xxx)
  
  async function checkSession() {
    const { data } = await client.auth.getSession();
    if (!data.session) {
      // Try to get the token from the URL hash
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      
      if (accessToken && refreshToken) {
        const { error } = await client.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        
        if (error) {
          document.querySelector('.reset-card').innerHTML = `
            <div class="reset-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h2>Link Expired</h2>
            <p>This password reset link has expired. Please request a new one.</p>
            <a href="login.html" style="color:#0f172a;font-weight:600;margin-top:1rem;display:inline-block;">Go to Login</a>
          `;
        } else {
          // Session set, show reset form
          document.getElementById('reset-btn').style.display = 'block';
        }
      } else {
        document.querySelector('.reset-card').innerHTML = `
          <div class="reset-icon"><i class="fas fa-exclamation-triangle"></i></div>
          <h2>Invalid Link</h2>
          <p>This password reset link is invalid. Please request a new one.</p>
          <a href="login.html" style="color:#0f172a;font-weight:600;margin-top:1rem;display:inline-block;">Go to Login</a>
        `;
      }
    }
  }

  checkSession();

  async function resetPassword() {
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const messageEl = document.getElementById('message');
    const passwordError = document.getElementById('password-error');
    const confirmError = document.getElementById('confirm-error');
    const btn = document.getElementById('reset-btn');

    passwordError.textContent = '';
    confirmError.textContent = '';
    messageEl.style.display = 'none';

    if (newPassword.length < 6) {
      passwordError.textContent = 'Password must be at least 6 characters.';
      return;
    }

    if (newPassword !== confirmPassword) {
      confirmError.textContent = 'Passwords do not match.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating...';

    const { error } = await client.auth.updateUser({ password: newPassword });

    if (error) {
      messageEl.style.display = 'block';
      messageEl.className = 'message error';
      messageEl.textContent = 'Error: ' + error.message;
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    } else {
      messageEl.style.display = 'block';
      messageEl.className = 'message success';
      messageEl.textContent = '✅ Password updated! Redirecting to login...';
      
      // Sign out and redirect
      await client.auth.signOut();
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    }
  }
</script>
