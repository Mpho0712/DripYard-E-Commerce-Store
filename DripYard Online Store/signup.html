<body class="signup-page">

<!-- HEADER: Taller Glass Effect -->
<header class="sticky-header" style="position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); height: 70px;">
  
  <!-- LEFT: Navbar -->
  <nav class="main-nav" style="flex: 1; display: flex; align-items: center; gap: 1.2rem;">
    <a href="index.html">Home</a>
    <a href="store.html">Shop</a>
  </nav>
  
  <!-- CENTER: Logo -->
  <div class="logo-wrapper" style="position: absolute; left: 50%; transform: translateX(-50%);">
    <img src="images/logo.png" alt="DripYard Logo" class="logo-image" style="height: 42px;" />
  </div>
  
</header>

<style>
  .main-nav a {
    color: #334155;
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 500;
    transition: color 0.2s;
    white-space: nowrap;
  }
  .main-nav a:hover { color: #0f172a; }
  .main-nav a.active { color:  #0f172a; font-weight: 600; }
</style>
  <main class="signup-container">
    <h2>Join DripYard</h2>
    <form class="signup-form" id="signupForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        <div class="error" id="nameError"></div>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        <div class="error" id="phoneError"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <div class="error" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>
        <div class="strength" id="passwordStrength"></div>
        <div class="error" id="passwordError"></div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
        <div class="error" id="confirmError"></div>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" placeholder="Enter your address" required>
        <div class="error" id="addressError"></div>
      </div>

      <div class="form-group">
        <label for="mall">Mall</label>
        <input type="text" id="mall" name="mall" placeholder="Enter your Mall" required>
        <div class="error" id="mallError"></div>
      </div>

      <div class="form-group">
        <label for="postal_code">Postal Code</label>
        <input type="text" id="postal_code" name="postal_code" placeholder="Enter your Postal Code" required>
        <div class="error" id="postal_codeError"></div>
      </div>

      <div class="form-group">
        <label for="province">Province</label>
        <select id="province" name="province" required>
          <option value="">Select your province</option>
          <option value="Eastern Cape">Eastern Cape</option>
          <option value="Western Cape">Western Cape</option>
          <option value="Gauteng">Gauteng</option>
          <option value="KwaZulu-Natal">KwaZulu-Natal</option>
          <option value="Free State">Free State</option>
          <option value="Limpopo">Limpopo</option>
          <option value="Mpumalanga">Mpumalanga</option>
          <option value="North West">North West</option>
          <option value="Northern Cape">Northern Cape</option>
        </select>
        <div class="error" id="provinceError"></div>
      </div>

      <button type="submit" class="btn">Sign Up</button>
    </form>
    <p class="login-text">Already have an account? <a href="login.html">Login</a></p>
  </main>

  <div class="go-home-container">
    <button class="go-home-btn" onclick="window.location.href='store.html'">Back to Shop</button>
  </div>

  <footer class="footer">
